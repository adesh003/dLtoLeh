<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31102f" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Liquid Glass Border -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" />

  <!-- Mountain Silhouette (Delhi to Ladakh Theme) -->
  <path d="M 18 70 L 40 38 L 52 54 L 68 30 L 85 70 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Glowing Musical Note Icon -->
  <path d="M 44 60 C 44 65.5 39.5 70 34 70 C 28.5 70 24 65.5 24 60 C 24 54.5 28.5 50 34 50 C 36.5 50 38.8 50.9 40.5 52.4 L 40.5 30 L 68 24 L 68 38 L 44 43.5 Z" fill="url(#glyphGrad)" filter="url(#glow)" />
</svg>
